; Minimal OGR/GDAL OSM driver configuration for the first internal Breda
; OSM/Geofabrik candidate import (MARKET-04A). Read by import-breda-osm.js
; via `ogr2ogr -oo CONFIG_FILE=...`.
;
; Exposes only the "points" (node) layer, and only the specific tags this
; project is authorized to extract as `basic_info`, per
; docs/api/source-registry-schema.md's "Data categories" section and
; docs/api/import-run-schema.md's "Data minimisation" principle:
; amenity (category), name, phone/contact:phone, website/contact:website,
; addr:* (composed address), plus the node's own stable id (osm_id).
;
; `other_tags=no` means no catch-all/freeform-tag column is ever produced
; for this layer — a tag not explicitly listed in `attributes=` below is
; never read into any GDAL output field in the first place, never
; filtered out after the fact. This matches this project's stronger
; default: data outside the authorized scope must never reach durable
; storage, not even in an intermediate, temporary form.
;
; Way/relation-based locations are out of scope for this first pass (see
; docs/api/import-run-schema.md's "Update (2026-09-05)" node-only note).
; This file only configures [points] — import-breda-osm.js only ever
; queries that one layer, never [lines]/[multipolygons]/
; [multilinestrings]/[other_relations]; those sections are left at GDAL's
; own built-in defaults and are simply never read by this project.

[general]
; "contact:phone" -> "contact_phone" etc. — import-breda-osm.js reads the
; laundered (underscore) property names from GDAL's GeoJSON output.
attribute_name_laundering=yes
; Untagged nodes (pure way vertices, e.g. a building outline's corners)
; never appear in the points layer — only nodes carrying at least one of
; the attributes below.
report_all_nodes=no
report_all_ways=no

[points]
; Promotes the node's own OSM id into an explicit "osm_id" property —
; this project's stable OSM-node identity (ImportExtractionRecord.record_locator
; is derived from it). Without this, the id only exists as GDAL's internal
; feature FID, which is not serialized into GeoJSON output.
osm_id=yes
attributes=amenity,name,phone,contact:phone,website,contact:website,addr:housenumber,addr:street,addr:city,addr:postcode,addr:country
; No unsignificant/ignore entries and no catch-all field — nothing beyond
; osm_id and the attributes list above is ever read from a node's tags.
other_tags=no
