name: Production database preflight (read-only)

# ═══════════════════════════════════════════════════════════════════════
# READ-ONLY. This workflow never applies a migration, never creates or
# alters a database object, and never runs arbitrary SQL. Its only job is
# to answer, without changing anything: are we actually ready to run
# production-db-migrate.yml?
#
# Same protection as that workflow: `environment: production-migrations`
# below only pauses for human approval if "Required reviewers" has been
# configured on that environment in this repository's Settings →
# Environments. See docs/guides/production-migration-pipeline.md's
# "One-time GitHub setup" section — that one-time setup, once done,
# protects BOTH this workflow and production-db-migrate.yml, with no
# extra configuration needed for this file specifically.
# ═══════════════════════════════════════════════════════════════════════
#
# Manual-only, by design: no `push`, `pull_request`, or `schedule`
# trigger exists anywhere in this file.
#
# Safe order of production actions (see docs/guides/production-migration-pipeline.md):
#   1. Run THIS workflow (confirm: "verify"). Read its summary.
#   2. Only if it reports "Ready for migration": dispatch
#      production-db-migrate.yml (confirm: "migrate", its own separate
#      `release_versions` input) for the specific staged migration(s)
#      this run confirmed.
# The confirmation phrases ("verify" here, "migrate" there,
# "repair-history-only" on production-db-history-reconcile.yml) are all
# deliberately different strings so a copy-pasted confirmation can never
# accidentally trigger the wrong workflow.
#
# This workflow answers a narrower question than "should I migrate now?":
# it checks what is currently known-APPLIED (locally and live) and what
# is currently known-STAGED (a local file, not yet applied anywhere) —
# see the `applied_versions`/`staged_versions` inputs below. It never
# asks "what should I release" — that is production-db-migrate.yml's own
# `release_versions` input and its own dry-run check, deliberately a
# DIFFERENT input, on a DIFFERENT workflow, because "what's currently
# true" and "what should happen next" are different questions that must
# never be silently conflated behind one shared value.
#
# "Ready for migration" means more than "the commands didn't error": this
# workflow requires the union of `applied_versions` and `staged_versions`
# to exactly equal the real local files on disk, AND the live history to
# exactly equal `applied_versions` — never "whatever happens to be
# there." Any other divergence (a version applied live with no local
# file, a declared version with no local file at all — e.g. staging
# `0010` before it has actually been merged to `main` — or a pending
# version not named in `staged_versions`) reports "Not ready" and names a
# required, separate, explicitly-approved history reconciliation instead
# — it never runs `supabase migration repair` or any SQL itself. This
# matters for this repository specifically: migrations `0001`-`0009` were
# applied to production by hand via the Supabase Dashboard's SQL Editor,
# not through this CLI pipeline, so the live history table does not
# already record them — the first real run of this workflow (declaring
# `applied_versions: 0001,...,0009`, `staged_versions: none`) is expected
# to surface exactly that gap. See
# docs/guides/production-migration-pipeline.md's "History reconciliation"
# section, and production-db-history-reconcile.yml, the only workflow in
# this repository allowed to fix it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type "verify" to confirm you intend to run a READ-ONLY preflight
          check against the PRODUCTION Supabase project. Any other value
          aborts before any secret is read or any connection is made.
        required: true
        type: string
      applied_versions:
        description: >-
          The exact migration version(s) that MUST already be fully
          applied right now — the filename prefix before the first
          underscore (e.g. "0010"), comma-separated, present as a local
          file AND recorded in the live migration history table. Type
          "none" if none should be applied yet. This is the current,
          already-live baseline — never the next release; see
          staged_versions for that.
        required: true
        type: string
      staged_versions:
        description: >-
          The exact migration version(s) that MUST currently exist ONLY
          as a local file on this branch — staged for a future release,
          not yet applied anywhere live. Comma-separated, or "none" if
          nothing should be staged yet. A version can never be declared
          in both applied_versions and staged_versions.
        required: true
        type: string

jobs:
  preflight:
    name: Check production migration readiness (no writes)
    runs-on: ubuntu-latest

    # See the warning banner at the top of this file. Nothing below this
    # line runs until a reviewer configured on this environment explicitly
    # approves this specific run — *if and only if* the environment's
    # protection rules have actually been set up.
    environment: production-migrations

    steps:
      - name: Require the literal confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "verify" ]; then
            echo "::error::Confirmation input was not exactly 'verify' — aborting before reading any secret or opening any connection. Re-run and type it exactly. (Looking to actually apply a migration? That is production-db-migrate.yml, a separate workflow, confirmed with a different phrase.)"
            exit 1
          fi

      - name: Mask secret values defensively (in addition to GitHub's automatic masking)
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          echo "::add-mask::${{ secrets.SUPABASE_PROJECT_ID }}"
          echo "::add-mask::${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Check that every required secret is configured
        id: secrets_check
        run: |
          missing=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ] && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing — configure them on the 'production-migrations' environment (Settings → Environments → production-migrations → Environment secrets). See docs/guides/production-migration-pipeline.md."
            echo "verdict=blocked" >> "$GITHUB_OUTPUT"
            echo "reason=Missing secret(s):$missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "verdict=ok" >> "$GITHUB_OUTPUT"
          echo "All required secrets are present (values never printed)."

      - uses: actions/checkout@v4

      - name: Fail if no migrations exist yet
        run: |
          if [ -z "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "::error::No .sql files found under supabase/migrations/ — nothing to check readiness for."
            exit 1
          fi

      # Ground truth for the integrity check inside the history-comparison
      # step below — computed directly from the files on disk, never from
      # anything the Supabase CLI prints, so a change in the CLI's output
      # format can be detected rather than silently trusted.
      - name: Determine local migration versions from supabase/migrations/
        id: local_versions
        run: |
          set -euo pipefail
          # `printf '%s\n' "${arr[@]}"` on a genuinely EMPTY array still
          # prints one blank line (printf executes its format at least
          # once, treating a missing %s argument as empty) — this helper
          # prints nothing at all when called with zero arguments, which
          # is what every list-comparison below actually needs.
          print_lines () { [ "$#" -gt 0 ] && printf '%s\n' "$@"; return 0; }

          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          versions=()
          for f in "${files[@]}"; do
            versions+=("$(basename "$f" | cut -d'_' -f1)")
          done
          mapfile -t sorted_versions < <(print_lines "${versions[@]}" | grep -v '^$' | sort -u || true)
          print_lines "${sorted_versions[@]}" > local-versions.txt
          echo "Local migration versions found: ${sorted_versions[*]:-(none)}"

      # v3 is the version currently documented in the action's own
      # README as of this workflow's last review (2026-09-06) — kept in
      # sync with production-db-migrate.yml's own setup-cli step.
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Confirm the CLI itself installed correctly
        run: supabase --version

      # A single command that, by construction, exercises all three of
      # this preflight's "does auth/config/project-coupling work?"
      # checks at once: `link` reads and must accept supabase/config.toml
      # (config check), authenticates using SUPABASE_ACCESS_TOKEN (auth
      # check), and resolves + connects to the real project named by
      # SUPABASE_PROJECT_ID (project-coupling check). Confirmed via the
      # Supabase CLI's own documentation to be read-only against the
      # target database — it stores the password locally and reads
      # Management API project metadata, but performs no schema or data
      # write of any kind.
      # SUPABASE_DB_PASSWORD is set here (not only in production-db-migrate.yml's
      # own db-push step) per the Supabase CLI's own documented CI example
      # (docs/guides/deployment/managing-environments), which sets all
      # three secrets before `supabase link` — the docs don't say which
      # later commands specifically require it, so it's provided
      # throughout this job rather than guessed to be unnecessary for
      # `migration list`'s own direct Postgres history-table read.
      - name: Link to the production Supabase project (read-only)
        id: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"; then
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::error::'supabase link' failed — see the command output above for the CLI's own reason (commonly: invalid/expired access token, wrong project ref, or a config.toml the CLI rejects). No further checks were run."
            echo "verdict=blocked" >> "$GITHUB_OUTPUT"
            echo "reason=supabase link failed - see job log" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Unverified risk (see docs/guides/production-migration-pipeline.md's
      # "Residual risks"): this repo's migration files are named
      # 0001_..., 0002_..., ... (a 4-digit sequential prefix), while the
      # Supabase CLI's own documented convention is a 14-digit
      # YYYYMMDDHHMMSS timestamp prefix. This step is the first real,
      # live test of whether that mismatch actually breaks anything —
      # local Docker-based validation cannot reproduce it, since it
      # requires a real linked project's migration-history table.
      #
      # "Ready for migration" requires ALL of the following, never just
      # "the command ran":
      #   1. `applied_versions` and `staged_versions` don't overlap
      #      (a config-sanity check on the inputs themselves).
      #   2. `supabase migration list` succeeds and its LOCAL column
      #      matches the real files on disk (the parsing/CLI-format
      #      integrity check already used before this round).
      #   3. The real local files on disk exactly equal
      #      `applied_versions` UNION `staged_versions` — no declared
      #      version may be missing a local file (this is what stops a
      #      preflight on `main` from ever declaring `0010` as staged
      #      before it has actually been merged there), and no local file
      #      may be undeclared.
      #   4. The live history's applied set exactly equals
      #      `applied_versions` — no more (an unexpected already-applied
      #      version), no less (something not yet reconciled, most likely
      #      for this repository: `0001`-`0009`, applied by hand outside
      #      the CLI).
      # None of these are fixed here — this workflow never runs
      # `supabase migration repair` or any SQL; any mismatch always means
      # production-db-history-reconcile.yml is needed first (a separate,
      # explicitly approved workflow).
      - name: Compare local and live migration history — require exact expected sync (read-only)
        id: history_check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # `-e` (errexit) is deliberately NOT set in this step: every
          # command that can legitimately fail is already checked
          # explicitly below and exits with its own specific verdict/
          # reason, and `-e` would risk an unannounced abort on some
          # intermediate command (e.g. a zero-match comm/printf) instead
          # of one of those specific, explained exits.
          set -uo pipefail

          # `printf '%s\n' "${arr[@]}"` on a genuinely EMPTY array still
          # prints one blank line (printf executes its format at least
          # once, treating a missing %s argument as empty) — every
          # `comm`/mapfile list comparison below needs zero lines for an
          # empty set, so this helper is used instead throughout this
          # step. Found via local testing (2026-09-06): the very first,
          # most important scenario this workflow exists for — an empty
          # `parsed_remote` before any reconciliation — was silently
          # broken by this until fixed.
          print_lines () { [ "$#" -gt 0 ] && printf '%s\n' "$@"; return 0; }

          raw_applied="${{ github.event.inputs.applied_versions }}"
          if [ "$(printf '%s' "$raw_applied" | tr '[:upper:]' '[:lower:]')" = "none" ]; then
            raw_applied=""
          fi
          mapfile -t applied_versions < <(printf '%s' "$raw_applied" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$' | sort -u || true)

          raw_staged="${{ github.event.inputs.staged_versions }}"
          if [ "$(printf '%s' "$raw_staged" | tr '[:upper:]' '[:lower:]')" = "none" ]; then
            raw_staged=""
          fi
          mapfile -t staged_versions < <(printf '%s' "$raw_staged" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$' | sort -u || true)

          echo "Declared applied_versions: ${applied_versions[*]:-(none)}"
          echo "Declared staged_versions:  ${staged_versions[*]:-(none)}"

          mapfile -t overlap < <(comm -12 <(print_lines "${applied_versions[@]}") <(print_lines "${staged_versions[@]}") || true)
          if [ "${#overlap[@]}" -gt 0 ]; then
            echo "::error::Version(s) declared in BOTH 'applied_versions' and 'staged_versions': ${overlap[*]}. A version is either already applied or staged, never both — fix the inputs and re-run."
            {
              echo "verdict=not_ready"
              echo "reason=version(s) declared in both applied_versions and staged_versions: ${overlap[*]}"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          mapfile -t declared_union < <(print_lines "${applied_versions[@]}" "${staged_versions[@]}" | grep -v '^$' | sort -u || true)

          if ! supabase migration list --linked | tee migration-list.txt; then
            echo "::error::'supabase migration list' exited non-zero — cannot determine migration history."
            {
              echo "verdict=not_ready"
              echo "reason=supabase migration list failed - see job log"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! grep -qi 'LOCAL' migration-list.txt || ! grep -qi 'REMOTE' migration-list.txt; then
            echo "::error::Could not find the expected LOCAL/REMOTE header in 'supabase migration list' output — its format may not match what this workflow parses. Treating history as NOT reliably parseable, never as 'nothing pending'."
            {
              echo "verdict=not_ready"
              echo "reason=unexpected migration list output format"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Column separator may render as either an ASCII "|" or a
          # Unicode box-drawing "│" depending on CLI version/TTY
          # detection — not conclusively documented for a non-interactive
          # CI shell. Normalize to "|" with `sed` FIRST, then split with a
          # single-character `awk -F'|'`: tested locally (2026-09-06) and
          # confirmed that matching "│" directly inside an awk bracket
          # character class (`-F'[|│]'`) silently mis-splits under some
          # locale/gawk combinations — this two-step form does not.
          mapfile -t parsed_local < <(sed 's/│/|/g' migration-list.txt | awk -F'|' 'NF>=2 { v=$1; gsub(/^[ \t]+|[ \t]+$/, "", v); if (v ~ /^[0-9]+$/) print v }' | sort -u || true)
          mapfile -t parsed_remote < <(sed 's/│/|/g' migration-list.txt | awk -F'|' 'NF>=2 { v=$2; gsub(/^[ \t]+|[ \t]+$/, "", v); if (v ~ /^[0-9]+$/) print v }' | sort -u || true)
          mapfile -t known_local < local-versions.txt

          if [ "$(print_lines "${parsed_local[@]}")" != "$(print_lines "${known_local[@]}")" ]; then
            echo "::error::The LOCAL column parsed from 'supabase migration list' does not match the actual files in supabase/migrations/. Either this workflow's parsing is wrong or the CLI's output format has changed — never assume this means history is fine."
            echo "Parsed from CLI output: ${parsed_local[*]:-(none)}"
            echo "Actual files on disk:   ${known_local[*]:-(none)}"
            {
              echo "verdict=not_ready"
              echo "reason=migration list output did not parse as expected"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Requirement 3: real local files must exactly equal the
          # declared union. This is what stops a preflight run on `main`
          # from ever accepting `staged_versions: 0010` before `0010` has
          # actually been merged there — if it's not a real file yet,
          # known_local won't contain it and this check fails closed.
          mapfile -t local_undeclared < <(comm -23 <(print_lines "${known_local[@]}") <(print_lines "${declared_union[@]}") || true)
          mapfile -t declared_missing_file < <(comm -23 <(print_lines "${declared_union[@]}") <(print_lines "${known_local[@]}") || true)
          if [ "${#local_undeclared[@]}" -gt 0 ] || [ "${#declared_missing_file[@]}" -gt 0 ]; then
            echo "::error::Local files under supabase/migrations/ do not exactly match applied_versions + staged_versions. Local file(s) not declared in either input: ${local_undeclared[*]:-(none)}. Declared version(s) with no matching local file: ${declared_missing_file[*]:-(none)}. A version must never be declared as applied or staged before it exists as a file on this branch."
            {
              echo "verdict=not_ready"
              echo "reason=local files vs declared versions mismatch - undeclared local: ${local_undeclared[*]:-none}, declared without file: ${declared_missing_file[*]:-none}"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Requirement 4: live history's applied set must exactly equal
          # applied_versions — no orphan (extra) and no unreconciled gap
          # (missing).
          mapfile -t remote_extra < <(comm -23 <(print_lines "${parsed_remote[@]}") <(print_lines "${applied_versions[@]}") || true)
          mapfile -t remote_missing < <(comm -23 <(print_lines "${applied_versions[@]}") <(print_lines "${parsed_remote[@]}") || true)
          if [ "${#remote_extra[@]}" -gt 0 ] || [ "${#remote_missing[@]}" -gt 0 ]; then
            echo "::error::Live migration history does not exactly match 'applied_versions'. Applied live but NOT declared: ${remote_extra[*]:-(none)}. Declared as applied but NOT recorded live: ${remote_missing[*]:-(none)}. If migrations were applied to production by hand outside the CLI, a separate, explicitly-approved history reconciliation (production-db-history-reconcile.yml) is required first — see docs/guides/production-migration-pipeline.md's 'History reconciliation' section. This workflow never runs 'supabase migration repair' automatically."
            {
              echo "verdict=not_ready"
              echo "reason=live history vs applied_versions mismatch - live-only: ${remote_extra[*]:-none}, unreconciled: ${remote_missing[*]:-none}"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Internal consistency safeguard: given the checks above,
          # pending (local - remote) must equal staged_versions exactly.
          # This should always hold by construction; if it doesn't,
          # something in this step's own logic disagrees with itself and
          # must not be trusted.
          mapfile -t pending < <(comm -23 <(print_lines "${parsed_local[@]}") <(print_lines "${parsed_remote[@]}") || true)
          if [ "$(print_lines "${pending[@]}" | sort -u)" != "$(print_lines "${staged_versions[@]}" | sort -u)" ]; then
            echo "::error::Internal consistency check failed: computed pending set (${pending[*]:-none}) does not equal staged_versions (${staged_versions[*]:-none}) even though earlier checks passed. Do not trust this result — treat as not ready and investigate this workflow's own logic."
            {
              echo "verdict=not_ready"
              echo "reason=internal consistency check failed - pending (${pending[*]:-none}) != staged_versions (${staged_versions[*]:-none})"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "History is exactly in sync with what was declared: applied=${applied_versions[*]:-(none)}, staged=${staged_versions[*]:-(none)}."
          {
            echo "verdict=ready"
            echo "reason=local and live history match applied_versions/staged_versions exactly"
          } >> "$GITHUB_OUTPUT"

      - name: Write a run summary — the actual "ready or not" verdict
        if: always()
        run: |
          {
            echo "## Production migration preflight (read-only)"
            echo ""
            echo "- Triggered by: \`${{ github.actor }}\`"
            echo "- Declared applied_versions: \`${{ github.event.inputs.applied_versions }}\`"
            echo "- Declared staged_versions:  \`${{ github.event.inputs.staged_versions }}\`"
            echo "- Approved via the \`production-migrations\` environment's required reviewer(s)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
            if [ "${{ steps.history_check.outputs.verdict }}" = "ready" ]; then
              echo "### ✅ Ready for migration"
              echo ""
              echo "Secrets present, CLI accepted the configuration, authentication and project linking succeeded, local files exactly match applied_versions + staged_versions, and live history exactly matches applied_versions. If staged_versions names the release you intend to apply next, production-db-migrate.yml (confirm: \"migrate\", its own \`release_versions\` input set to the same version(s)) may now be dispatched."
            else
              echo "### ❌ Not ready for migration"
              echo ""
              echo "Reason: \`${{ steps.history_check.outputs.reason || 'an earlier step failed before the history check ran - see its own step log above' }}\`"
              echo ""
              echo "If this is because earlier migrations were applied to production by hand (Dashboard SQL Editor) rather than via this CLI pipeline, the fix is a separate, explicitly-approved history reconciliation via production-db-history-reconcile.yml — never an automatic one. See docs/guides/production-migration-pipeline.md's 'History reconciliation' section. This workflow never runs \`supabase migration repair\` and never applies SQL."
            fi
            echo ""
            echo "### Local vs. live migration history (raw CLI output)"
            echo '```'
            cat migration-list.txt 2>/dev/null || echo "(not captured — job failed before this step; see the step logs above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
