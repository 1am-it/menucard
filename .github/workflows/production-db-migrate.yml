name: Apply production database migrations

# ═══════════════════════════════════════════════════════════════════════
# READ THIS BEFORE RELYING ON THIS WORKFLOW FOR SAFETY.
#
# `environment: production-migrations` below is what makes this workflow
# pause for a human approval — but ONLY if that environment has actually
# been configured with "Required reviewers" in this repository's own
# Settings → Environments UI. GitHub Actions silently AUTO-CREATES an
# environment with ZERO protection the first time a workflow references
# one that doesn't exist yet. If that one-time setup step is skipped,
# `workflow_dispatch` alone is enough to run this job immediately, with
# no approval gate at all — nothing in this YAML file can detect or
# prevent that on its own. See
# docs/guides/production-migration-pipeline.md's "One-time GitHub setup"
# section for the exact steps, and do them before this workflow is ever
# dispatched for real.
# ═══════════════════════════════════════════════════════════════════════
#
# Manual-only, by design: no `push`, `pull_request`, or `schedule`
# trigger exists anywhere in this file. A migration must never run just
# because someone pushed to `main` — see
# docs/guides/production-migration-pipeline.md for the full reasoning.
#
# What this does, and only this: links the Supabase CLI to the real
# production project and runs `supabase db push`, which compares
# supabase/migrations/*.sql against that project's own migration history
# table and applies only the ones not yet recorded there, in filename
# order — never a full re-run, never a downgrade, never arbitrary SQL
# pasted by hand. See validate-migrations.yml for the automatic,
# secret-free check that should already have proven these same files
# apply cleanly, before this workflow is ever dispatched.
#
# ALWAYS run production-db-preflight.yml first, on the same commit, and
# read its "Ready for migration" verdict before ever dispatching this
# workflow — see docs/guides/production-migration-pipeline.md's own
# "Safe order of production actions" section. This workflow does not
# invoke the preflight itself or verify it already ran; that ordering is
# a documented operational rule, not something GitHub Actions can enforce
# between two independent workflow_dispatch runs without a much more
# invasive, custom cross-workflow gate this project has deliberately not
# built (see that guide's own "Residual risks").
#
# `release_versions` below is deliberately a DIFFERENT input, with a
# different name and meaning, from production-db-preflight.yml's
# `applied_versions`/`staged_versions`. The preflight checks "what is
# currently true" (what's already applied, what's staged); this workflow
# checks "what should happen right now" — the specific release this
# dispatch is authorized to push. Never conflate the two: typing a
# preflight's `staged_versions` value into this workflow's
# `release_versions` field (or vice versa) happens to often be the same
# version string, but they answer different questions and are validated
# by entirely separate logic.
#
# _(Added 2026-09-09)_ Every database-reading/-writing step below (the
# before/after `migration list` and the real `db push`) connects via an
# explicit `SUPABASE_DB_URL` (Session Pooler, port 5432) rather than
# `--linked`. Confirmed via a real dispatch of production-db-preflight.yml:
# GitHub Actions runners have no IPv6 route, and `--linked` resolves to
# Supabase's direct database connection, which is IPv6-only unless the
# project has the paid IPv4 add-on. `supabase link` itself is kept
# exactly as before for platform/project validation — it only calls the
# Management API, never opens the direct DB connection. See
# docs/guides/production-migration-pipeline.md's "One-time GitHub setup"
# section for how to obtain this connection string.
#
# _(Rebuilt 2026-09-09, after three consecutive real-dispatch failures)_
# The safety decision below no longer parses `supabase db push --dry-run`'s
# human-readable text AT ALL. Three separate attempts to parse that
# output (matching a documented-but-wrong line shape, then stripping its
# Unicode bullet with `tr`, then a bullet-agnostic digit-extraction with
# `awk`) each failed on a real dispatch against byte-identical real
# input that worked correctly in local testing every time — strong
# evidence the true failure mode is something about this specific
# command's raw output (line-ending or terminal-control-character
# behavior neither `gh run view --log` nor local reproduction can fully
# reveal), not any one specific regex. `supabase migration list`'s own
# output, by contrast, has been parsed correctly on two real dispatches
# of production-db-preflight.yml — the one structural difference: that
# parser never anchors a match to the start/end of a whole line
# (`awk -F'|'` field-splitting only), while every dry-run-text attempt
# did (`^...$` line anchors). The dry-run still runs, still visible in
# the job log, and its own exit code is still checked (a real CLI/
# connection failure is a real, non-text-parsing signal worth stopping
# on) — but its printed migration names are never read, parsed, or
# compared again. The actual go/no-go decision below instead reuses
# `production-db-preflight.yml`'s own proven `migration list` parsing
# technique (unchanged field-splitting logic, same masking discipline)
# against two hard-coded constants — see "Verify exact migration state"
# below — that must be updated via a reviewed pull request for any
# future release, the same discipline production-db-history-reconcile.yml
# already applies to its own `DOCUMENTED_LEGACY_VERSIONS`.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type "migrate" to confirm you intend to apply pending migrations
          to the PRODUCTION Supabase project. Any other value aborts
          before any secret is read or any connection is made.
        required: true
        type: string
      release_versions:
        description: >-
          The exact migration version(s) THIS RUN is authorized to apply
          — the filename prefix before the first underscore (e.g.
          "0010"), comma-separated if more than one. Must exactly match
          this workflow's own hard-coded DOCUMENTED_RELEASE_VERSIONS
          constant (see the "Verify exact migration state" step) or the
          workflow stops before the real push — typing a different value
          here does not bypass that check. Normally the same version(s)
          just confirmed via production-db-preflight.yml's
          `staged_versions` input. Type "none" (not blank) if you expect
          nothing to be pending.
        required: true
        type: string

jobs:
  migrate:
    name: Apply pending migrations to production
    runs-on: ubuntu-latest

    # See the warning banner at the top of this file. Nothing below this
    # line runs until a reviewer configured on this environment explicitly
    # approves this specific run, in the GitHub Actions UI — *if and only
    # if* the environment's protection rules have actually been set up.
    environment: production-migrations

    steps:
      - name: Require the literal confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "migrate" ]; then
            echo "::error::Confirmation input was not exactly 'migrate' — aborting before reading any secret or opening any connection. Re-run and type it exactly."
            exit 1
          fi

      - name: Mask secret values defensively (in addition to GitHub's automatic masking)
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          echo "::add-mask::${{ secrets.SUPABASE_PROJECT_ID }}"
          echo "::add-mask::${{ secrets.SUPABASE_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.SUPABASE_DB_URL }}"

      - name: Check that every required secret is configured
        run: |
          missing=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ] && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "${{ secrets.SUPABASE_DB_URL }}" ] && missing="$missing SUPABASE_DB_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing — configure them on the 'production-migrations' environment (Settings → Environments → production-migrations → Environment secrets). See docs/guides/production-migration-pipeline.md."
            exit 1
          fi
          echo "All required secrets are present (values never printed)."

      # Stops early and clearly if SUPABASE_DB_URL is missing the Session
      # Pooler shape this pipeline requires — never prints the connection
      # string or password, only pattern-matches it.
      - name: Validate SUPABASE_DB_URL targets the Session Pooler on port 5432
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is empty. GitHub Actions runners have no IPv6 route to Supabase's direct database connection, so this pipeline requires the Session Pooler connection string explicitly. See docs/guides/production-migration-pipeline.md's 'One-time GitHub setup' section (Supabase Dashboard → Connect → Session pooler)."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" == *":6543"* ]]; then
            echo "::error::SUPABASE_DB_URL appears to use port 6543 — that is the Transaction Pooler, not the Session Pooler this pipeline requires. Re-copy the 'Session pooler' connection string from Supabase Dashboard → Connect (port 5432), not 'Transaction pooler'."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != *":5432"* ]]; then
            echo "::error::SUPABASE_DB_URL does not appear to use port 5432. Expected the Session Pooler connection string (port 5432) from Supabase Dashboard → Connect → Session pooler."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != *".pooler.supabase.com"* ]]; then
            echo "::error::SUPABASE_DB_URL does not look like a Supavisor pooler host (expected a *.pooler.supabase.com hostname) — this may be a direct database connection string, which fails from GitHub Actions runners (no IPv6 route). Use the Session Pooler connection string instead."
            exit 1
          fi
          echo "SUPABASE_DB_URL looks like a valid Session Pooler connection string (port 5432, pooler.supabase.com host). The value itself was never printed."

      - uses: actions/checkout@v4

      - name: Fail if no migrations exist yet
        run: |
          if [ -z "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "::error::No .sql files found under supabase/migrations/ — nothing to apply. Aborting rather than doing nothing silently."
            exit 1
          fi

      # v1 (previously pinned here) is outdated — v3 is the version
      # currently documented in the action's own README as of this
      # workflow's last review (2026-09-06).
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Kept exactly as platform/project validation only — auth check
      # (SUPABASE_ACCESS_TOKEN) and project-ref resolution via the
      # Management API. Every step below that actually reads or writes
      # migration history connects via SUPABASE_DB_URL instead (see this
      # file's 2026-09-09 addition at the top) — `link`'s own DB
      # connection attempt is unaffected by the IPv6 issue that broke
      # `--linked` elsewhere, so it is left unchanged here.
      - name: Link to the production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # Unverified risk (see docs/guides/production-migration-pipeline.md's
      # "Residual risks"): this repo's migration files are named
      # 0001_..., 0002_..., ... (a 4-digit sequential prefix), while the
      # Supabase CLI's own documented convention is a 14-digit
      # YYYYMMDDHHMMSS timestamp prefix. Whether the CLI merely needs a
      # lexicographically-sortable string (which zero-padded sequential
      # numbers satisfy) or hard-validates the timestamp format has not
      # been conclusively resolved from documentation alone. If the next
      # step errors or produces obviously wrong LOCAL/REMOTE output, that
      # mismatch is the first thing to suspect — run
      # production-db-preflight.yml (read-only) to investigate before
      # ever retrying this workflow.
      #
      # THE actual go/no-go decision for this release. Reuses
      # production-db-preflight.yml's own proven `migration list` parsing
      # (field-splitting only, never a whole-line anchor — see this
      # file's 2026-09-09 "Rebuilt" note at the top for why that matters)
      # against two constants that must be updated via a reviewed pull
      # request for any future release — never by typing a different
      # `release_versions` value at dispatch time alone. This mirrors
      # production-db-history-reconcile.yml's own
      # `DOCUMENTED_LEGACY_VERSIONS` discipline: a write this sensitive is
      # not left to a free-typed dispatch-time value by itself.
      #
      # Passes only when ALL of the following hold:
      #   1. `release_versions` exactly equals DOCUMENTED_RELEASE_VERSIONS.
      #   2. Local files under supabase/migrations/ exactly equal
      #      DOCUMENTED_APPLIED_VERSIONS ∪ DOCUMENTED_RELEASE_VERSIONS —
      #      no missing, no extra.
      #   3. `supabase migration list`'s LOCAL column matches those same
      #      real files exactly (the CLI-output integrity check already
      #      used in production-db-preflight.yml).
      #   4. `supabase migration list`'s REMOTE column exactly equals
      #      DOCUMENTED_APPLIED_VERSIONS — i.e. exactly the already-live
      #      baseline, with this release's version(s) confirmed NOT yet
      #      live. Any other outcome (already partially/fully applied,
      #      an unreconciled gap, an unexpected extra version) fails
      #      closed rather than guessing whether it's safe to push.
      - name: Verify exact migration state — the real safety gate (not dry-run text)
        id: exact_state_check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # `-e` deliberately not set — every command that can fail is
          # checked explicitly below with its own specific error message,
          # matching production-db-preflight.yml's own history_check step.
          set -uo pipefail
          print_lines () { [ "$#" -gt 0 ] && printf '%s\n' "$@"; return 0; }

          # This is THE documented, reviewed baseline for this release —
          # see docs/guides/production-migration-pipeline.md's "Safe
          # order of production actions" and
          # planning/decisions/013-production-migration-pipeline.md.
          # Changing either list for a future release means editing this
          # file via a reviewed pull request, never just dispatching with
          # a different `release_versions` value.
          DOCUMENTED_APPLIED_VERSIONS=(0001 0002 0003 0004 0005 0006 0007 0008 0009)
          DOCUMENTED_RELEASE_VERSIONS=(0010)

          raw="${{ github.event.inputs.release_versions }}"
          if [ "$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')" = "none" ]; then
            raw=""
          fi
          mapfile -t release_versions < <(printf '%s' "$raw" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$' | sort -u || true)

          if [ "$(print_lines "${release_versions[@]}")" != "$(print_lines "${DOCUMENTED_RELEASE_VERSIONS[@]}")" ]; then
            echo "::error::'release_versions' (${release_versions[*]:-none}) does not exactly match this workflow's own hard-coded DOCUMENTED_RELEASE_VERSIONS constant (${DOCUMENTED_RELEASE_VERSIONS[*]}). This workflow only ever releases that one reviewed set. To release a different version, edit the constant in this file via a reviewed pull request — never by typing a different value here."
            exit 1
          fi

          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          local_versions=()
          for f in "${files[@]}"; do
            local_versions+=("$(basename "$f" | cut -d'_' -f1)")
          done
          mapfile -t known_local < <(print_lines "${local_versions[@]}" | sort -u || true)

          mapfile -t declared_union < <(print_lines "${DOCUMENTED_APPLIED_VERSIONS[@]}" "${DOCUMENTED_RELEASE_VERSIONS[@]}" | sort -u || true)

          mapfile -t local_undeclared < <(comm -23 <(print_lines "${known_local[@]}") <(print_lines "${declared_union[@]}") || true)
          mapfile -t declared_missing_file < <(comm -23 <(print_lines "${declared_union[@]}") <(print_lines "${known_local[@]}") || true)
          if [ "${#local_undeclared[@]}" -gt 0 ] || [ "${#declared_missing_file[@]}" -gt 0 ]; then
            echo "::error::Local files under supabase/migrations/ do not exactly match DOCUMENTED_APPLIED_VERSIONS + DOCUMENTED_RELEASE_VERSIONS. Local file(s) not accounted for: ${local_undeclared[*]:-(none)}. Declared version(s) with no matching local file: ${declared_missing_file[*]:-(none)}. Aborting before any connection is opened."
            exit 1
          fi

          # `--db-url` (Session Pooler, port 5432) instead of `--linked`
          # — see this file's 2026-09-09 addition at the top.
          if ! supabase migration list --db-url "$SUPABASE_DB_URL" | tee before-migration-list.txt; then
            echo "::error::'supabase migration list' exited non-zero — cannot determine migration history. Aborting before any write."
            exit 1
          fi

          if ! grep -qi 'LOCAL' before-migration-list.txt || ! grep -qi 'REMOTE' before-migration-list.txt; then
            echo "::error::Could not find the expected LOCAL/REMOTE header in 'supabase migration list' output — its format may not match what this workflow parses. Treating history as NOT reliably parseable. Aborting before any write."
            exit 1
          fi

          # Same proven parsing as production-db-preflight.yml's own
          # history_check step: normalize the column separator, strip the
          # backticks the real CLI wraps each cell value in (confirmed
          # via a real dispatch — see that file's own 2026-09-09 note),
          # then split on "|" — field-splitting only, no whole-line
          # anchor, which is exactly the structural property this
          # rebuild is standardizing on.
          mapfile -t parsed_local < <(sed 's/│/|/g' before-migration-list.txt | tr -d '\140\047' | awk -F'|' 'NF>=2 { v=$1; gsub(/^[ \t]+|[ \t]+$/, "", v); if (v ~ /^[0-9]+$/) print v }' | sort -u || true)
          mapfile -t parsed_remote < <(sed 's/│/|/g' before-migration-list.txt | tr -d '\140\047' | awk -F'|' 'NF>=2 { v=$2; gsub(/^[ \t]+|[ \t]+$/, "", v); if (v ~ /^[0-9]+$/) print v }' | sort -u || true)

          if [ "$(print_lines "${parsed_local[@]}")" != "$(print_lines "${known_local[@]}")" ]; then
            echo "::error::The LOCAL column parsed from 'supabase migration list' does not match the actual files in supabase/migrations/. Either this workflow's parsing is wrong or the CLI's output format has changed — never assume this means history is fine."
            echo "Parsed from CLI output: ${parsed_local[*]:-(none)}"
            echo "Actual files on disk:   ${known_local[*]:-(none)}"
            exit 1
          fi

          mapfile -t remote_extra < <(comm -23 <(print_lines "${parsed_remote[@]}") <(print_lines "${DOCUMENTED_APPLIED_VERSIONS[@]}") || true)
          mapfile -t remote_missing < <(comm -23 <(print_lines "${DOCUMENTED_APPLIED_VERSIONS[@]}") <(print_lines "${parsed_remote[@]}") || true)
          if [ "${#remote_extra[@]}" -gt 0 ] || [ "${#remote_missing[@]}" -gt 0 ]; then
            echo "::error::Live migration history does not exactly equal DOCUMENTED_APPLIED_VERSIONS. Applied live but NOT declared: ${remote_extra[*]:-(none)}. Declared as applied but NOT recorded live: ${remote_missing[*]:-(none)}. If this release's version(s) already appear live, do not proceed — investigate before dispatching again. If earlier migrations are unreconciled, production-db-history-reconcile.yml is required first."
            exit 1
          fi

          echo "Exact migration state confirmed: live history is exactly ${DOCUMENTED_APPLIED_VERSIONS[*]}, and ${DOCUMENTED_RELEASE_VERSIONS[*]} is staged locally and not yet live. Proceeding."

          # Passed to the post-push verification step below via
          # $GITHUB_OUTPUT rather than redeclaring the two constants a
          # second time in a separate step (GitHub Actions steps share no
          # shell state) — this is the ONE place in this file that needs
          # to change for a future release, not two.
          echo "expected_after_release=${declared_union[*]}" >> "$GITHUB_OUTPUT"

      # Informational only from here on — its own exit code is still
      # checked (a real CLI/connection failure is a genuine, non-text
      # signal worth stopping on), but its printed migration names are
      # never read again. See this file's 2026-09-09 "Rebuilt" note at
      # the top for the three real-dispatch failures that led to this.
      - name: Dry-run (informational only — never used to gate the push)
        id: dry_run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        id: migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # `supabase db push` itself stops at the first migration that
          # fails to apply — it does not silently skip a broken file and
          # continue with the rest. A non-zero exit here fails this step,
          # and every step after it is skipped (no "unexpected migration
          # status" is ever reported as if it were success).
          #
          # `--yes` is the Supabase CLI's own documented global flag
          # ("answer yes to all prompts"; placed before the subcommand)
          # for exactly the non-interactive-confirmation problem
          # documented in Supabase GitHub Discussion #26366 (`db push`
          # can otherwise wait on a prompt a CI shell never answers, and
          # report success having applied nothing). This replaces the
          # previous `yes | supabase db push` workaround with the CLI's
          # own supported mechanism — no unbounded stdin pipe, and no
          # need for `set -o pipefail` to unmask a hidden failure behind
          # `yes`'s own always-zero exit status.
          #
          # `--db-url` (Session Pooler, port 5432) instead of `--linked`
          # — see this file's 2026-09-09 addition at the top.
          supabase --yes db push --db-url "$SUPABASE_DB_URL"

      # Active re-verification, not just a printed line: confirms the
      # push actually took effect, using the same proven parsing as the
      # gate above. Runs only if "Apply pending migrations" succeeded
      # (no `if: always()` here) — the informational display step below
      # still runs unconditionally for visibility even on failure.
      - name: Verify this release is now live (read-only)
        id: verify_live
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          print_lines () { [ "$#" -gt 0 ] && printf '%s\n' "$@"; return 0; }

          # Reuses the exact validated set the gate above already
          # computed (DOCUMENTED_APPLIED_VERSIONS ∪
          # DOCUMENTED_RELEASE_VERSIONS), passed via $GITHUB_OUTPUT rather
          # than redeclaring those two constants a second time in this
          # separate step.
          mapfile -t expected_after < <(printf '%s\n' ${{ steps.exact_state_check.outputs.expected_after_release }} | sort -u || true)

          if ! supabase migration list --db-url "$SUPABASE_DB_URL" | tee after-migration-list.txt; then
            echo "::error::'supabase migration list' exited non-zero while verifying the push. Do not assume success — investigate manually."
            exit 1
          fi

          mapfile -t parsed_remote_after < <(sed 's/│/|/g' after-migration-list.txt | tr -d '\140\047' | awk -F'|' 'NF>=2 { v=$2; gsub(/^[ \t]+|[ \t]+$/, "", v); if (v ~ /^[0-9]+$/) print v }' | sort -u || true)

          if [ "$(print_lines "${parsed_remote_after[@]}")" != "$(print_lines "${expected_after[@]}")" ]; then
            echo "::error::After the push, live migration history does NOT exactly equal the expected post-release set. Now recorded live: ${parsed_remote_after[*]:-(none)}. Expected: ${expected_after[*]}. Do not treat this run as successful — investigate manually."
            exit 1
          fi

          echo "Confirmed: live migration history now exactly equals ${expected_after[*]} — this release is live."

      - name: Show the resulting migration state (verifiable result)
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL" | tee after-migration-list.txt

      - name: Write a run summary
        if: always()
        run: |
          {
            echo "## Production migration run"
            echo ""
            echo "- Triggered by: \`${{ github.actor }}\`"
            echo "- Declared release_versions: \`${{ github.event.inputs.release_versions }}\`"
            echo "- Approved via the \`production-migrations\` environment's required reviewer(s)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Outcome: \`${{ job.status }}\`"
            echo ""
            echo "### Migration state before this run"
            echo '```'
            cat before-migration-list.txt 2>/dev/null || echo "(not captured — see the step logs above)"
            echo '```'
            echo ""
            echo "### Migration state after this run"
            echo '```'
            cat after-migration-list.txt 2>/dev/null || echo "(not captured — job may have failed before reaching this step; see the step logs above)"
            echo '```'
            echo ""
            echo "**Next step**: record the outcome in \`planning/CONTEXT.md\` (this project's own convention for every prior migration — e.g. \"Migration 0007 has since been applied live\"), and confirm the exact same result in the Supabase dashboard's Table Editor/SQL Editor before merging or deploying any app code that depends on this schema."
          } >> "$GITHUB_STEP_SUMMARY"
