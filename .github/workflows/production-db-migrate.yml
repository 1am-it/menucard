name: Apply production database migrations

# ═══════════════════════════════════════════════════════════════════════
# READ THIS BEFORE RELYING ON THIS WORKFLOW FOR SAFETY.
#
# `environment: production-migrations` below is what makes this workflow
# pause for a human approval — but ONLY if that environment has actually
# been configured with "Required reviewers" in this repository's own
# Settings → Environments UI. GitHub Actions silently AUTO-CREATES an
# environment with ZERO protection the first time a workflow references
# one that doesn't exist yet. If that one-time setup step is skipped,
# `workflow_dispatch` alone is enough to run this job immediately, with
# no approval gate at all — nothing in this YAML file can detect or
# prevent that on its own. See
# docs/guides/production-migration-pipeline.md's "One-time GitHub setup"
# section for the exact steps, and do them before this workflow is ever
# dispatched for real.
# ═══════════════════════════════════════════════════════════════════════
#
# Manual-only, by design: no `push`, `pull_request`, or `schedule`
# trigger exists anywhere in this file. A migration must never run just
# because someone pushed to `main` — see
# docs/guides/production-migration-pipeline.md for the full reasoning.
#
# What this does, and only this: links the Supabase CLI to the real
# production project and runs `supabase db push`, which compares
# supabase/migrations/*.sql against that project's own migration history
# table and applies only the ones not yet recorded there, in filename
# order — never a full re-run, never a downgrade, never arbitrary SQL
# pasted by hand. See validate-migrations.yml for the automatic,
# secret-free check that should already have proven these same files
# apply cleanly, before this workflow is ever dispatched.
#
# ALWAYS run production-db-preflight.yml first, on the same commit, and
# read its "Ready for migration" verdict before ever dispatching this
# workflow — see docs/guides/production-migration-pipeline.md's own
# "Safe order of production actions" section. This workflow does not
# invoke the preflight itself or verify it already ran; that ordering is
# a documented operational rule, not something GitHub Actions can enforce
# between two independent workflow_dispatch runs without a much more
# invasive, custom cross-workflow gate this project has deliberately not
# built (see that guide's own "Residual risks").

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type "migrate" to confirm you intend to apply pending migrations
          to the PRODUCTION Supabase project. Any other value aborts
          before any secret is read or any connection is made.
        required: true
        type: string
      expected_versions:
        description: >-
          The exact migration version(s) this run is expected to apply —
          the part of the filename before the first underscore (e.g.
          "0010"), comma-separated if more than one. Must match this run's
          own dry-run output exactly, or the workflow stops before the
          real push. Use the same value you used for
          production-db-preflight.yml's "Ready for migration" run. Type
          "none" (not blank) if you expect nothing to be pending.
        required: true
        type: string

jobs:
  migrate:
    name: Apply pending migrations to production
    runs-on: ubuntu-latest

    # See the warning banner at the top of this file. Nothing below this
    # line runs until a reviewer configured on this environment explicitly
    # approves this specific run, in the GitHub Actions UI — *if and only
    # if* the environment's protection rules have actually been set up.
    environment: production-migrations

    steps:
      - name: Require the literal confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "migrate" ]; then
            echo "::error::Confirmation input was not exactly 'migrate' — aborting before reading any secret or opening any connection. Re-run and type it exactly."
            exit 1
          fi

      - name: Mask secret values defensively (in addition to GitHub's automatic masking)
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          echo "::add-mask::${{ secrets.SUPABASE_PROJECT_ID }}"
          echo "::add-mask::${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Check that every required secret is configured
        run: |
          missing=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ] && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing — configure them on the 'production-migrations' environment (Settings → Environments → production-migrations → Environment secrets). See docs/guides/production-migration-pipeline.md."
            exit 1
          fi
          echo "All required secrets are present (values never printed)."

      - uses: actions/checkout@v4

      - name: Fail if no migrations exist yet
        run: |
          if [ -z "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "::error::No .sql files found under supabase/migrations/ — nothing to apply. Aborting rather than doing nothing silently."
            exit 1
          fi

      # v1 (previously pinned here) is outdated — v3 is the version
      # currently documented in the action's own README as of this
      # workflow's last review (2026-09-06).
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link to the production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # Unverified risk (see docs/guides/production-migration-pipeline.md's
      # "Residual risks"): this repo's migration files are named
      # 0001_..., 0002_..., ... (a 4-digit sequential prefix), while the
      # Supabase CLI's own documented convention is a 14-digit
      # YYYYMMDDHHMMSS timestamp prefix. Whether the CLI merely needs a
      # lexicographically-sortable string (which zero-padded sequential
      # numbers satisfy) or hard-validates the timestamp format has not
      # been conclusively resolved from documentation alone. If this step
      # or the next one errors or produces obviously wrong LOCAL/REMOTE
      # output, that mismatch is the first thing to suspect — run
      # production-db-preflight.yml (read-only) to investigate before
      # ever retrying this workflow.
      - name: Show which migrations are pending (visible before anything is applied)
        id: before
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase migration list --linked | tee before-migration-list.txt

      # Read-only. Confirms exactly which migration version(s) `db push`
      # would apply, and aborts BEFORE the real push if that set doesn't
      # match `expected_versions` exactly — e.g. because a migration was
      # applied out of band since the preflight ran, an unexpected file
      # is pending, or the wrong `expected_versions` value was typed.
      # Output line format ("Would push migration <file>...") confirmed
      # against a real `--dry-run` run reported in a Supabase CLI GitHub
      # issue (supabase/cli#776) — the official reference page documents
      # the flag's purpose but does not show example stdout.
      - name: Dry-run — confirm exactly which migration(s) would be applied
        id: dry_run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # Every `mapfile < <(... | sort -u)` below ends in `|| true`:
          # under `set -e -o pipefail`, a `grep` that matches zero lines
          # (a legitimate outcome here — e.g. "nothing pending") exits
          # non-zero and would otherwise abort this whole step.
          raw="${{ github.event.inputs.expected_versions }}"
          if [ "$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')" = "none" ]; then
            raw=""
          fi
          mapfile -t expected_versions < <(printf '%s' "$raw" | tr ',' '\n' | tr -d '[:space:]' | grep -v '^$' | sort -u || true)

          supabase db push --linked --dry-run | tee dry-run-output.txt

          mapfile -t would_push_files < <(grep -oE 'Would push migration [^[:space:]]+\.\.\.' dry-run-output.txt | sed -E 's/^Would push migration (.+)\.\.\.$/\1/' || true)
          would_push_versions=()
          for f in "${would_push_files[@]:-}"; do
            [ -n "$f" ] && would_push_versions+=("$(basename "$f" | cut -d'_' -f1)")
          done
          mapfile -t would_push_versions < <(printf '%s\n' "${would_push_versions[@]:-}" | grep -v '^$' | sort -u || true)

          echo "Dry-run says these version(s) would be applied: ${would_push_versions[*]:-(none)}"
          echo "This run declared expected version(s):          ${expected_versions[*]:-(none)}"

          if [ "$(printf '%s\n' "${would_push_versions[@]:-}")" != "$(printf '%s\n' "${expected_versions[@]:-}")" ]; then
            echo "::error::Dry-run would apply a different migration version set than declared in 'expected_versions'. Would apply: ${would_push_versions[*]:-(none)}. Expected: ${expected_versions[*]:-(none)}. Aborting before the real push — re-run with the correct 'expected_versions' input, or investigate why an unexpected migration is pending (see docs/guides/production-migration-pipeline.md) before dispatching again."
            exit 1
          fi

          echo "Dry-run matches the declared release exactly. Proceeding to the real push."

      - name: Apply pending migrations
        id: migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # `supabase db push` itself stops at the first migration that
          # fails to apply — it does not silently skip a broken file and
          # continue with the rest. A non-zero exit here fails this step,
          # and every step after it is skipped (no "unexpected migration
          # status" is ever reported as if it were success).
          #
          # `--yes` is the Supabase CLI's own documented global flag
          # ("answer yes to all prompts"; placed before the subcommand)
          # for exactly the non-interactive-confirmation problem
          # documented in Supabase GitHub Discussion #26366 (`db push`
          # can otherwise wait on a prompt a CI shell never answers, and
          # report success having applied nothing). This replaces the
          # previous `yes | supabase db push` workaround with the CLI's
          # own supported mechanism — no unbounded stdin pipe, and no
          # need for `set -o pipefail` to unmask a hidden failure behind
          # `yes`'s own always-zero exit status.
          supabase --yes db push --linked

      - name: Show the resulting migration state (verifiable result)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked | tee after-migration-list.txt

      - name: Write a run summary
        if: always()
        run: |
          {
            echo "## Production migration run"
            echo ""
            echo "- Triggered by: \`${{ github.actor }}\`"
            echo "- Declared expected version(s): \`${{ github.event.inputs.expected_versions }}\`"
            echo "- Approved via the \`production-migrations\` environment's required reviewer(s)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Outcome: \`${{ job.status }}\`"
            echo ""
            echo "### Migration state before this run"
            echo '```'
            cat before-migration-list.txt 2>/dev/null || echo "(not captured — see the step logs above)"
            echo '```'
            echo ""
            echo "### Migration state after this run"
            echo '```'
            cat after-migration-list.txt 2>/dev/null || echo "(not captured — job may have failed before reaching this step; see the step logs above)"
            echo '```'
            echo ""
            echo "**Next step**: record the outcome in \`planning/CONTEXT.md\` (this project's own convention for every prior migration — e.g. \"Migration 0007 has since been applied live\"), and confirm the exact same result in the Supabase dashboard's Table Editor/SQL Editor before merging or deploying any app code that depends on this schema."
          } >> "$GITHUB_STEP_SUMMARY"
